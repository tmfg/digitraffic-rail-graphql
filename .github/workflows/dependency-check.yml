name: Dependency check
on:
  push:
    branches: [master]
  schedule:
    - cron: "0 8 * * *" # UTC
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to run the dependency check against. Defaults to the ref the workflow was started from."
        required: false
        type: string
jobs:
  dependency-check:
    if: github.repository != 'tmfg/digitraffic-rail-graphql'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref || github.ref }}
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: corretto
          cache: maven
      - name: Cache dependency-check files
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository/org/owasp
          key: ${{ runner.os }}-dependency-check-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-dependency-check-
      - name: Dependency check
        run: mvn -Pdepcheck
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      # gh-pages-publish overwrites the report at its exact path, so runs against a
      # custom ref get their own filename and leave the master report untouched.
      - name: Resolve report path
        id: report
        if: ${{ success() || failure() }}
        env:
          REF: ${{ inputs.ref }}
        run: |
          path=target/dependency-check-report.html
          if [ -n "$REF" ] && [ -f "$path" ]; then
            slug=$(printf '%s' "$REF" | tr -c 'A-Za-z0-9._-' '-')
            path="target/dependency-check-report-$slug.html"
            cp target/dependency-check-report.html "$path"
          fi
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Publish report on GitHub Pages
        if: ${{ success() || failure() }}
        uses: tmfg/digitraffic-actions@gh-pages-publish/v1
        with:
          GH_PAGES_BRANCH: gh-pages
          FILE_PATH: ${{ steps.report.outputs.path }}
          COMMIT_MESSAGE: Upload dependency check report
          LINK_TEXT: Dependency check report
      - name: Notify Slack
        if: failure()
        uses: tmfg/digitraffic-actions@slack-notify/v1
        with:
          status: failure
          text: FAILED Rail GraphQL Dependency Check
          fields: repo, job, took
          webhook-url: ${{ secrets.SLACK_WARNINGS_WEBHOOK_URL }}
