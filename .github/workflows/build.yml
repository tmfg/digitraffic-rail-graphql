name: Build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    if: github.repository != 'tmfg/digitraffic-rail-graphql'
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: 25
          distribution: corretto
          cache: maven
      - name: Compile
        run: mvn -f pom.xml install -e -U -DskipTests=true -Ddependency-check.skip=true
      - name: Checkout rail
        run: git clone https://github.com/tmfg/digitraffic-rail
      - name: Setup database
        working-directory: digitraffic-rail/dbrail
        run: |
          docker compose up -d db
          docker compose up db-init
      - name: Run tests
        run: mvn -f pom.xml test -Dspring.datasource.url=jdbc:aws-wrapper:mysql://127.0.0.1:3306/avoindata_test
      - name: Publish test results
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: success() || failure()
        with:
          name: jUnit tests
          path: target/surefire-reports/*.xml
          reporter: java-junit
