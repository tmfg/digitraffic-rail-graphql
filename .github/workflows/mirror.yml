name: "Mirror repo to public"
on:
  push:
    branches:
      - master
jobs:
  mirror-action:
    if: github.repository != 'tmfg/digitraffic-rail-graphql'
    runs-on: ubuntu-26.04
    steps:
      - name: mirror
        uses: tmfg/digitraffic-actions@c8414c3b4233ad587eee5b6e9c844cd6821cf22c # mirror/v2
        with:
          mirror-repo: git@github.com:tmfg/digitraffic-rail-graphql.git
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
